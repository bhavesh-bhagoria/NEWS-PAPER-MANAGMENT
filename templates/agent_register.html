<!DOCTYPE html>
<html>
<head>
    <title>Agent Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .register-container {
            border: 1px solid #000;
            padding: 40px;
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #000;
            background-color: #fff;
            color: #000;
        }

        input:focus {
            outline: none;
            border: 2px solid #000;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #000;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error-box {
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #cc0000;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .error-box ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>

</head>
<body>

    <div class="register-container">
        <h2>Agent Registration</h2>

        <form method="POST">

            {% if errors %}
                <div class="error-box">
                    <ul>
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <!-- Username -->
            <label>Username</label>
            <input type="text"
                   name="username"
                   value="{{ username or '' }}"
                   pattern="^[A-Za-z ]{3,50}$"
                   title="Username must contain only letters and spaces (3-50 characters)"
                   required>

            <!-- Mobile -->
            <label>Mobile No</label>
            <input type="tel"
                   name="mobile_no"
                   value="{{ mobile_no or '' }}"
                   pattern="^[6-9][0-9]{9}$"
                   maxlength="10"
                   required
                   title="Enter a valid 10-digit Indian mobile number starting with 6-9">

            <!-- Password -->
            <label>Password</label>
            <input type="password"
                   name="password"
                   pattern="^(?=.*[!@#$%^&*(),.?&quot;:{}|<>]).{4,}$"
                   minlength="4"
                   required
                   title="Password must be at least 4 characters and include at least one special symbol">

            <button type="submit">Register</button>

        </form>

        <a href="{{ url_for('admin_login') }}" class="back-link">Back to Login</a>
    </div>

</body>
</html>
