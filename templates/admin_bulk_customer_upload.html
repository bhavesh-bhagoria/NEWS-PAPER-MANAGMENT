<!DOCTYPE html>
<html>
<head>
<title>Bulk Upload Customers</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: white;
    color: black;
    margin: 40px;
}

h2{
    margin-bottom: 20px;
}

label{
    font-weight: bold;
}

input[type="file"]{
    margin-top: 10px;
    padding: 6px;
    border: 1px solid black;
}

button{
    margin-top: 20px;
    background-color: black;
    color: white;
    padding: 10px 18px;
    border: none;
    font-size: 15px;
    cursor: pointer;
}

button:hover{
    background-color: #333;
}

.back-btn{
    margin-bottom: 20px;
}

pre{
    margin-top: 20px;
    background-color: #f4f4f4;
    padding: 10px;
}

</style>

</head>

<body>

<!-- Back Button -->
<a href="{{ url_for('admin_add_customer') }}">
    <button type="button" class="back-btn">← Back</button>
</a>

<h2>Bulk Upload Customers</h2>

<form action="{{ url_for('upload_bulk_customers') }}" method="POST" enctype="multipart/form-data">

<label>Select CSV File</label><br><br>

<input type="file" name="file" required>

<br><br>

<button type="submit">
Upload Customers
</button>

</form>

<br>

<p>CSV format must be:</p>

<pre>
agent_id,name,password,mobile_no,area_locality,landmark_building,flat_house_office_no,start_date
11,Rahul Sharma,1234,9876543210,Palasia,Near Temple,Flat 301,2026-03-01
</pre>

</body>
</html>
