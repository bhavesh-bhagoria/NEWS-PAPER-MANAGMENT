<!DOCTYPE html>
<html>
<head>
    <title>Customer Login - Newspaper Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/customer_login.css') }}">

    <style>
        .error-box {
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #cc0000;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .error-box ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Customer Login</h1>

            {% if errors %}
                <div class="error-box">
                    <ul>
                        {% for error in errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>Mobile Number:</label>
                    <input type="text"
                           name="mobile_no"
                           value="{{ mobile_no or '' }}"
                           required>
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password" required>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <p class="info-text">
                Contact your newspaper agent to create your account.
            </p>
        </div>
    </div>
</body>
</html>
