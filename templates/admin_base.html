<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#fff;
    color:#000;
}

.navbar{
    background:#000;
    color:#fff;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-left a{
    color:#fff;
    text-decoration:none;
    margin-right:20px;
    font-size:15px;
}

.nav-left a:hover{
    text-decoration:underline;
}

.nav-right a{
    background:#d11a2a;
    color:#fff;
    text-decoration:none;
    padding:6px 14px;
    border-radius:4px;
    font-size:14px;
}

.nav-right a:hover{
    background:#a80f1c;
}

.container{
    padding:30px;
}

</style>
</head>

<body>
 <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<div class="navbar">

    <div class="nav-left">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_add_customer') }}">Add Customer</a>
        <a href="{{ url_for('admin_customers') }}">Customers</a>
        <a href="{{ url_for('admin_bills') }}">Bills</a>
        <a href="{{ url_for('admin_pause_requests') }}">Pause Requests</a>
    </div>

    <div class="nav-right">
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>

</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
