<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#fff;
            color:#000;
        }
        .navbar{
            background:#000;
            color:#fff;
            padding:15px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .nav-left a, .nav-right a{
            color:#fff;
            text-decoration:none;
            margin-right:20px;
            font-size:15px;
        }
        .nav-left a:hover, .nav-right a:hover{
            text-decoration:underline;
        }
        .container{
            padding:30px;
        }
        .brand{
            font-weight:bold;
            font-size:18px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="nav-left">
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('admin_add_customer') }}">Add Customer</a>
        <a href="{{ url_for('admin_customers') }}">Customers</a>
        <a href="{{ url_for('admin_bills') }}">Bills</a>
        <a href="{{ url_for('admin_pause_requests') }}">Pause Requests</a>
    </div>
  
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
